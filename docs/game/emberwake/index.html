<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#140b1e" />
<title>EMBERWAKE — a platform adventure</title>
<meta name="description" content="Carry the light back through five worlds. A browser platformer with precise controls, secrets and no install." />

<!--
  No web fonts. A font request is a render-blocking round trip before the first meaningful
  paint, and on a cold connection it is the slowest thing on this page — the whole game is
  smaller than one weight of a display face. The system stack is already loaded, so text is on
  screen in the first frame.
-->
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!--
  The loading screen is inline, with its styles already applied, so it paints in the first
  frame. Anything else means a blank page for as long as the stylesheet and script take — which
  on a slow connection is the entire first impression.
-->
<div id="boot">
  <div class="boot-inner">
    <div class="boot-ember" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>EMBERWAKE</h1>
    <p class="boot-sub">Carry the light back</p>
  </div>
</div>

<div id="game"></div>

<div id="rotate" aria-hidden="true">
  <div>
    <div class="rot-icon">⟳</div>
    <b>Turn your device</b>
    <span>Emberwake plays in landscape — there is more of the world to see.</span>
  </div>
</div>

<noscript>
  <div class="noscript"><h1>EMBERWAKE</h1><p>This game needs JavaScript. Enable it and reload to play.</p></div>
</noscript>

<script src="game.js" defer></script>
</body>
</html>
